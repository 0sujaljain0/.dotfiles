# all other settings
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
# set -as terminal-overrides ',xterm-ghostty:Ss=\E[%p1%d q:Se=\E[2 q'

set -g mouse on

# set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g default-shell /bin/zsh
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded"


setw -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on


# Press Prefix + e to dump entire scrollback into Neovim
bind-key e capture-pane -S - -J \; save-buffer /tmp/tmux-buffer \; new-window 'nvim -c "set number" /tmp/tmux-buffer'

# ═══════════════════════════════════════════════════════════════════════
#  APPEARANCE — replace everything from your "Palette (GitHub dark)"
#  block down to "mode-style" with this section. Requires tmux ≥ 3.2
#  and a Nerd Font (you have one — the  glyph proves it).
# ═══════════════════════════════════════════════════════════════════════

# ── Palette (GitHub dark, Primer colours) ───────────────────────────────
set -g @bg      '#0d1117'   # bar background (use 'default' for transparent)
set -g @bg0     '#161b22'   # pill background
set -g @fg      '#c9d1d9'   # primary text
set -g @muted   '#8b949e'   # secondary text
set -g @border  '#30363d'   # pane borders / separators
set -g @accent  '#00e68a'   # session pill, active window
set -g @gold    '#ffd700'   # git branch, prefix mode
set -g @blue    '#58a6ff'   # copy mode
set -g @green   '#3fb950'   # staged
set -g @orange  '#f0883e'   # modified
set -g @red     '#f85149'   # conflicts, bell

# Session pill colour doubles as a mode indicator:
#   green = normal · gold = prefix held · blue = copy/search mode
set -g @mode_color "#{?client_prefix,#{@gold},#{?pane_in_mode,#{@blue},#{@accent}}}"

# ── Bar ─────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom          # or top
set -g status-interval 5
set -g status-justify absolute-centre   # windows centred; use 'left' to hug the session pill
set -g status-style "bg=#{@bg},fg=#{@fg}"
set -g status-left-length 40
set -g status-right-length 150

# ── Left: session pill ──────────────────────────────────────────────────
set -g status-left "#[fg=#{E:@mode_color},bg=#{@bg}]#[fg=#{@bg},bg=#{E:@mode_color},bold]  #{=14:session_name} #[fg=#{E:@mode_color},bg=#{@bg}] "

# ── Windows ─────────────────────────────────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@muted},bg=#{@bg}] #I #W#{?window_zoomed_flag,  ,} "
setw -g window-status-current-format "#[fg=#{@bg0},bg=#{@bg}]#[fg=#{@accent},bg=#{@bg0},bold]#I #W#{?window_zoomed_flag,  ,}#[fg=#{@bg0},bg=#{@bg},nobold]"
setw -g window-status-activity-style none
setw -g window-status-bell-style "fg=#{@red},bold"

# ── Right: git pill · date/time pill ────────────────────────────────────
# git pill (drawn by the script, disappears outside a repo, shrinks with width)
set -g status-right "\
#(~/.dotfiles/scripts/git-segments.sh \"#{pane_current_path}\" \"#{client_width}\" \"#{@bg0}\" \"#{@gold}\" \"#{@orange}\" \"#{@muted}\" \"#{@green}\" \"#{@red}\")\
#[fg=#{@bg0},bg=#{@bg}]#[fg=#{@muted},bg=#{@bg0}]#{?#{e|>=:#{client_width},90},  %a %d %b ,}#[fg=#{@fg},bold]  %H:%M #[fg=#{@bg0},bg=#{@bg}]"

# ── Panes ───────────────────────────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-style "fg=#{@border}"
set -g pane-active-border-style "fg=#{@accent}"
set -g pane-scrollbars on
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=#{@bg0},fg=#{@border}"

# ── Popups, messages, selection ─────────────────────────────────────────
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@border}"
set -g popup-style "bg=#{@bg}"
set -g message-style "fg=#{@bg},bg=#{@gold},bold"
set -g message-command-style "fg=#{@bg},bg=#{@blue},bold"
set -g mode-style "fg=#{@bg},bg=#{@blue}"
set -g clock-mode-colour '#00e68a'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind '"' split-window -v
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind-key "w" display-popup -E -w 60% -h 50% -d '#{pane_current_path}' -T 'sessions' tv sesh
bind-key "g" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'git' lazygit


#set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'JosephLai241/tmux-line-numbers'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

run-shell ~/.tmux/plugins/tpm/tpm
