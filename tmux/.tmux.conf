# all other settings
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
# set -as terminal-overrides ',xterm-ghostty:Ss=\E[%p1%d q:Se=\E[2 q'

set -g mouse on

# set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g default-shell /bin/zsh
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded"


setw -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on


# Press Prefix + e to dump entire scrollback into Neovim
bind-key e capture-pane -S - -J \; save-buffer /tmp/tmux-buffer \; new-window 'nvim -c "set number" /tmp/tmux-buffer'

# ── Palette (GitHub dark) ───────────────────────────────────────────
set -g @accent  '#00e68a'   # bright green — active / session
set -g @gold    '#ffd700'   # git branch
set -g @fg      '#c9d1d9'    # primary text
set -g @muted   '#8b949e'   # secondary text
set -g @border  '#30363d'   # separators / inactive borders
set -g @bg0     '#161b22'   # subtle segment background

# Status bar position
set -g status-position top
set -g status-interval 5

# Status bar base colors
set -g status-style 'bg=default fg=#{@muted}'
set -g status-left-length 100
set -g status-right-length 120

# Left: session name in an accent pill
set -g status-left '#[fg=#{@accent},bold] #S #[fg=#{@border}]| '

# Right: git branch (+ dirty marker) | date | time
# NOTES:
#  - Keep #{pane_current_path} UNQUOTED — quoting it stops tmux expanding it,
#    which blanks the whole segment.
#  - No `%` inside the #() — tmux runs strftime over this string, so a printf
#    %s would turn into a Unix timestamp. Use echo only.
set -g status-right " #(git -C #{pane_current_path} rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo '#[fg=#{@gold},bold] '$(git -C #{pane_current_path} branch --show-current)$(git -C #{pane_current_path} diff --quiet 2>/dev/null || echo ' #[fg=#{@accent}]*')' #[fg=#{@muted}]('$(git -C #{pane_current_path} remote get-url origin 2>/dev/null)') #[fg=#{@border}]|') #[fg=#{@muted}]%a %d %b #[fg=#{@border}]|#[fg=#{@fg},bold] %H:%M "

# Bottom border: enable a 2nd status row and fill it with a thin rule sized
# to the client width, so it always spans the full screen (no fixed limit).
# #{client_width} expands inside the #(); no `%` in the command (strftime-safe).
# set -g status 2
# set -g status-format[1] '#[fg=#{@border}]#(yes ─ | head -n #{client_width} | tr -d "\n")'

# Window status
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#{@muted}] #I:#W '
setw -g window-status-current-format '#[fg=#{@accent},bold] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#{@border}'
set -g pane-active-border-style 'fg=#{@accent}'

# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right

# Message / command prompt styling
set -g message-style 'bg=#{@accent} fg=#000000 bold'
set -g mode-style 'bg=#{@accent} fg=#000000 bold'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind '"' split-window -v
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind-key "w" display-popup -E -w 60% -h 50% -d '#{pane_current_path}' -T 'sessions' tv sesh
bind-key "g" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'git' lazygit


#set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'JosephLai241/tmux-line-numbers'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

run-shell ~/.tmux/plugins/tpm/tpm
