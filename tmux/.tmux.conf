# all other settings
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-overrides ',*:Setuls=\E[5 m'
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'


# set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g default-shell /bin/zsh
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded"

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on


# Status bar position
set -g status-position top
 
# Status bar colors
set -g status-style 'bg=default fg=#8b949e'
set -g status-left-length 100
set -g status-right-length 100
 
# Status bar content
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right "#(git -C #{pane_current_path} rev-parse --is-inside-work-tree 2>/dev/null >/dev/null && echo '#[fg=#8b949e]git:#[fg=#ffd700,bold]'$(git -C #{pane_current_path} branch --show-current)'('$(git -C #{pane_current_path} remote -v | awk \"{ print \\$2 }\" | uniq)')') #[fg=#8b949e]│ %+ "
# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#00e68a,bold] <#I:#W> '
 
# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'
 
# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right
 
# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind '"' split-window -v
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind-key "w" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'sessions' tv sesh
bind-key "g" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'git' lazygit


#set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run-shell ~/.tmux/plugins/tpm/tpm'
