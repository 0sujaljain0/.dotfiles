#
# prezto - mimic the default prezto prompt (sorin)
#

add_newline = true

# A minimal left prompt
format = """$username$localip > $directory$git_branch$git_status $kubernetes \n$character"""

# move the rest of the prompt to the right
right_format = """$status"""


[gcloud]
format = '{gcp::[$account(\($project\))]($style)}'

[localip]
ssh_only = false
format = '@[$localipv4](bold #64748b)'
disabled = false

[kubernetes]
disabled = false
format = '{[k8s:](#64748b)[$context-$namespace]($style)}'


[username]
format = "{[$user]($style)}"
show_always = true
style_root = "bold red"
style_user = "italic yellow"
disabled = false

[character]
success_symbol = "[❱](yellow)"
error_symbol = "[❱](red)"
vicmd_symbol = "[❰](cyan)"

[git_branch]
format = '[{](bold)[git:](#64748b)[$branch]($style)'
style = 'bold underline #eedc58 italic'
[python]
format = '[(\($virtualenv\) )]($style)'
style = 'white'

[git_status]
format = '\[$all_status$ahead_behind\][}](bold white)'
ahead = '[⬆](bold purple)'
behind = '[⬇](bold purple)'
staged = '[✚](green)'
deleted = '[✖](red)'
renamed = '[➜](purple)'
stashed = '[✭](cyan)'
untracked = '[?](bold blue)'
modified = '[!](bold red)'
conflicted = '[═](yellow)'
diverged = '⇕'
up_to_date = '[nil](italic #64748b)'

[directory]
style = "bold #FFA500"
format = '[\[](bold) [pwd:](#64748b) [$path]($style) [\]](bold)[$read_only]($read_only_style) '
truncation_length = 2
# truncation_symbol = ""
# fish_style_pwd_dir_length = 1

[cmd_duration]
format = '[$duration]($style) '

[line_break]
disabled = false

[status]
disabled = false
symbol = '✘ '
